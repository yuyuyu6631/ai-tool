[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xingdianping-api"
version = "0.1.0"
description = "FastAPI backend for Xingdianping MVP"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15.2",
  "apscheduler>=3.10.4",
  "bcrypt>=5.0.0",
  "fastapi>=0.115.12",
  "gunicorn>=23.0.0",
  "pydantic-settings>=2.8.1",
  "pymysql>=1.1.1",
  "cryptography>=42.0.0",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.39",
  "tenacity>=9.0.0",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "openpyxl>=3.1.0",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
