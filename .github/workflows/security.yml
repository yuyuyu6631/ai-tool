name: Security Scan

on:
  schedule:
    - cron: "23 3 * * 1"  # Every Monday at 03:23 UTC
  workflow_dispatch:

jobs:
  # ── npm audit ──────────────────────────────────────────────
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run npm audit
        run: npm audit --omit=dev || true

      - name: Create issue on vulnerabilities
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 npm audit found vulnerabilities',
              body: `npm audit reported issues.\n\n[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['security', 'dependencies']
            })

  # ── Python pip-audit ──────────────────────────────────────
  pip-audit:
    name: pip Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project
        working-directory: apps/api
        run: pip install .

      - name: Run pip-audit
        working-directory: apps/api
        run: pip-audit

      - name: Create issue on vulnerabilities
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 pip-audit found vulnerabilities',
              body: `pip-audit reported issues in the Python API.\n\n[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['security', 'dependencies']
            })
