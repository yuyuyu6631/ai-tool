name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ── Job 1: Build & Push Docker Images ─────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api-image: ${{ steps.meta-api.outputs.tags }}
      web-image: ${{ steps.meta-web.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/xingdp
            NEXT_PUBLIC_PUBLIC_BASE_PATH=/xingdp
            NEXT_PUBLIC_API_BASE_PATH=/xingdp
            SERVER_API_BASE_URL=http://api:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy over SSH ────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          BRANCH: main
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,BRANCH,PUBLIC_BASE_URL
          script: |
            set -euo pipefail
            cd "${DEPLOY_DIR:-/home/agent/xingdianping}"
            chmod +x ./deploy.sh
            ./deploy.sh

  # ── Job 3: Post-deploy Health Check ───────────────────────
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check public routes
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          base="${PUBLIC_BASE_URL:-http://changsha.01view.ydns.eu:12318}"
          curl -fsS "$base/xingdp/" >/dev/null
          curl -fsS "$base/xingdp/auth" >/dev/null
          curl -fsS "$base/xingdp/api/health" >/dev/null

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Deployment health check failed',
              body: `Deploy commit ${context.sha} failed health check.\n\n[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'deployment']
            })
