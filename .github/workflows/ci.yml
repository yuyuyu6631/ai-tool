name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint + Type Check ──────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Code tree hygiene
        run: npm run tree:check

      - name: Frontend lint
        working-directory: apps/web
        run: npx next lint

      - name: Frontend type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Contracts type check
        working-directory: packages/contracts
        run: npx tsc --noEmit

      - name: Prettier check changed source files
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Skipping changed-file Prettier check outside pull_request."
            exit 0
          fi

          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- \
              "apps/web/src/**/*.ts" \
              "apps/web/src/**/*.tsx" \
              "packages/contracts/src/**/*.ts"
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed source files require Prettier check."
            exit 0
          fi

          npx prettier --check "${files[@]}"

  # ── Job 2: Backend Tests ──────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xingdianping_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: apps/api
        run: pip install ".[dev]"

      - name: Run ruff lint on changed Python files
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Skipping changed-file ruff lint outside pull_request."
            exit 0
          fi

          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- "apps/api/**/*.py"
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files require ruff lint."
            exit 0
          fi

          ruff check "${files[@]}"

      - name: Run ruff format check on changed Python files
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Skipping changed-file ruff format check outside pull_request."
            exit 0
          fi

          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- "apps/api/**/*.py"
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files require ruff format check."
            exit 0
          fi

          ruff format --check "${files[@]}"

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/xingdianping_test"
          REDIS_URL: "redis://127.0.0.1:6379/0"
          AI_PROVIDER: stub
          SECRET_KEY: test-secret-key-for-ci
        run: python -m alembic upgrade head

      - name: Run pytest
        working-directory: apps/api
        env:
          DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/xingdianping_test"
          REDIS_URL: "redis://127.0.0.1:6379/0"
          AI_PROVIDER: stub
          SECRET_KEY: test-secret-key-for-ci
        run: pytest --tb=short -q

  # ── Job 3: Frontend Tests ─────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run vitest
        working-directory: apps/web
        run: npx vitest run

  # ── Job 4: Build Verification ─────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build:web

  # ── Job 5: Docs Sync Check ────────────────────────────────
  docs-check:
    name: Docs Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check docs are in sync
        run: npm run docs:check
